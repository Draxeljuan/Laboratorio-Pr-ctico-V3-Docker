<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Droguería Tenderos Balmoral - Acceso Seguro</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 font-sans min-h-screen flex flex-col">
    <div id="vistaLogin" class="flex-grow flex items-center justify-center p-4">
      <div
        class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border border-gray-100"
      >
        <div class="text-center mb-6">
          <h1 class="text-3xl font-extrabold text-blue-700">💊 Balmoral</h1>
          <p class="text-sm text-gray-500 mt-1">
            Gestión Segura de Medicamentos
          </p>
        </div>

        <form id="formLogin" onsubmit="ejecutarLogin(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700"
              >Usuario</label
            >
            <input
              type="text"
              id="loginUser"
              required
              class="mt-1 block w-full rounded border border-gray-300 p-2 outline-none focus:border-blue-500 bg-gray-50"
            />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700"
              >Contraseña</label
            >
            <input
              type="password"
              id="loginPass"
              required
              class="mt-1 block w-full rounded border border-gray-300 p-2 outline-none focus:border-blue-500 bg-gray-50"
            />
          </div>

          <div
            id="campoLoginMfa"
            class="hidden bg-yellow-50 p-3 rounded-lg border border-yellow-200 mt-2"
          >
            <label
              class="block text-xs font-bold text-yellow-800 uppercase mb-1"
              >🔐 Código de Doble Factor (Celular)</label
            >
            <input
              type="text"
              id="loginMfaToken"
              maxlength="6"
              placeholder="000000"
              class="w-full text-center text-xl font-mono p-2 rounded border border-yellow-300 outline-none tracking-widest"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition shadow mt-4"
          >
            Ingresar al Sistema
          </button>
        </form>
      </div>
    </div>

    <div id="vistaDashboard" class="hidden flex-col flex-grow">
      <nav class="bg-blue-700 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
          <h1 class="text-xl font-bold tracking-wide">
            💊 Panel de Inventario
          </h1>
          <div class="flex items-center space-x-4">
            <div class="bg-blue-800 p-2 rounded flex items-center space-x-2">
              <label
                for="globalMfaToken"
                class="text-xs font-semibold text-blue-200"
                >TOKEN 2FA OPERACIONES:</label
              >
              <input
                type="text"
                id="globalMfaToken"
                placeholder="123456"
                class="w-24 text-center bg-white text-gray-900 rounded font-mono font-bold px-1 py-0.5 text-sm"
              />
            </div>
            <button
              onclick="abrirModalMFA()"
              class="bg-green-500 hover:bg-green-600 px-3 py-1.5 rounded text-sm font-semibold transition shadow"
            >
              🔐 Vincular nuevo 2FA
            </button>
            <button
              onclick="logout()"
              class="text-xs text-blue-200 hover:text-white underline"
            >
              Salir
            </button>
          </div>
        </div>
      </nav>

      <main
        class="container mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow"
      >
        <section class="bg-white p-6 rounded-lg shadow-md h-fit">
          <h2 class="text-lg font-bold mb-4 text-gray-800 border-b pb-2">
            Registrar Medicamento
          </h2>
          <form
            id="formMedicamento"
            onsubmit="agregarMedicamento(event)"
            class="space-y-4"
          >
            <div>
              <label class="text-sm font-medium text-gray-600">Nombre</label>
              <input
                type="text"
                id="nombre"
                required
                class="mt-1 block w-full rounded border p-2 bg-gray-50"
              />
            </div>
            <div>
              <label class="text-sm font-medium text-gray-600">Categoría</label>
              <input
                type="text"
                id="categoria"
                class="mt-1 block w-full rounded border p-2 bg-gray-50"
              />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-sm font-medium text-gray-600">Precio</label>
                <input
                  type="number"
                  step="0.01"
                  id="precio"
                  required
                  class="mt-1 block w-full rounded border p-2 bg-gray-50"
                />
              </div>
              <div>
                <label class="text-sm font-medium text-gray-600">Stock</label>
                <input
                  type="number"
                  id="stock"
                  required
                  class="mt-1 block w-full rounded border p-2 bg-gray-50"
                />
              </div>
            </div>
            <button
              type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition"
            >
              Guardar Registro
            </button>
          </form>
        </section>

        <section class="bg-white p-6 rounded-lg shadow-md md:col-span-2">
          <h2 class="text-lg font-bold mb-4 text-gray-800 border-b pb-2">
            Control de Existencias
          </h2>
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th
                    class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase"
                  >
                    ID
                  </th>
                  <th
                    class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase"
                  >
                    Medicamento
                  </th>
                  <th
                    class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase"
                  >
                    Categoría
                  </th>
                  <th
                    class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase"
                  >
                    Precio
                  </th>
                  <th
                    class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase"
                  >
                    Stock
                  </th>
                  <th
                    class="px-4 py-2 text-center text-xs font-medium text-gray-500 uppercase"
                  >
                    Acciones
                  </th>
                </tr>
              </thead>
              <tbody
                id="tablaMedicamentos"
                class="bg-white divide-y text-sm"
              ></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div
      id="modalMFA"
      class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center z-50 backdrop-blur-sm"
    >
      <div
        class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full text-center"
      >
        <h3 class="text-xl font-bold mb-2 text-gray-800">
          🔒 Enrolamiento Criptográfico
        </h3>
        <p class="text-xs text-gray-500 mb-4">
          Escanea el QR en tu aplicación autenticadora para vincular tu cuenta.
        </p>
        <div class="bg-gray-100 p-4 rounded-lg my-4 flex justify-center border">
          <img id="mfaQrImg" src="" alt="QR" class="hidden w-48 h-48" />
          <div id="qrLoader" class="text-sm text-gray-500 py-20">
            Generando llave...
          </div>
        </div>
        <div class="mb-4">
          <input
            type="text"
            id="mfaVerifyCode"
            maxlength="6"
            placeholder="000000"
            class="border-2 w-full p-2 rounded-lg text-center text-2xl font-mono tracking-widest"
          />
        </div>
        <div class="flex space-x-3">
          <button
            onclick="cerrarModalMFA()"
            class="w-1/2 py-2 bg-gray-200 rounded-lg text-sm font-medium"
          >
            Cancelar
          </button>
          <button
            onclick="verificarEnrolamiento()"
            class="w-1/2 py-2 bg-green-500 text-white rounded-lg text-sm font-medium"
          >
            Activar
          </button>
        </div>
      </div>
    </div>

    <script>
      // CAMBIO ESTRATÉGICO: Usar rutas relativas para que funcione en Red Local (LAN)
      const API_URL = "/api";
      let tempSecretBase32 = "";

      // 1. Manejo del Login
      async function ejecutarLogin(event) {
        event.preventDefault();
        const username = document.getElementById("loginUser").value.trim();
        const password = document.getElementById("loginPass").value;
        const token = document.getElementById("loginMfaToken").value.trim();

        try {
          const response = await fetch(`${API_URL}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password, token }),
          });
          const data = await response.json();

          if (!response.ok) {
            alert(`Error: ${data.error}`);
            return;
          }

          // Si las credenciales son válidas pero requiere el token del celular
          if (data.require2FA) {
            document.getElementById("campoLoginMfa").classList.remove("hidden");
            alert(
              "🔐 Credenciales válidas. Ingresa el código de 6 dígitos de tu aplicación móvil.",
            );
            return;
          }

          // Autenticación completada con éxito
          if (data.success) {
            document.getElementById("vistaLogin").classList.add("hidden");
            document
              .getElementById("vistaDashboard")
              .classList.remove("hidden");
            listarMedicamentos();
          }
        } catch (err) {
          alert("Fallo de conexión con el servidor.");
        }
      }

      function logout() {
        document.getElementById("loginPass").value = "";
        document.getElementById("loginMfaToken").value = "";
        document.getElementById("campoLoginMfa").classList.add("hidden");
        document.getElementById("vistaDashboard").classList.add("hidden");
        document.getElementById("vistaLogin").classList.remove("hidden");
      }

      // 2. Control de Inventario
      async function listarMedicamentos() {
        try {
          const response = await fetch(`${API_URL}/medicamentos`);
          const medicamentos = await response.json();
          const tabla = document.getElementById("tablaMedicamentos");
          tabla.innerHTML = "";
          medicamentos.forEach((med) => {
            tabla.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-2 font-mono text-gray-400">${med.id}</td>
                            <td class="px-4 py-2 font-semibold">${med.nombre}</td>
                            <td class="px-4 py-2 text-gray-600">${med.categoria}</td>
                            <td class="px-4 py-2 font-medium">$${parseFloat(med.precio).toFixed(2)}</td>
                            <td class="px-4 py-2"><span class="px-2 py-0.5 rounded text-xs font-bold ${med.stock > 20 ? "bg-green-100 text-green-800" : "bg-red-100 text-red-800"}">${med.stock} uds</span></td>
                            <td class="px-4 py-2 text-center">
                                <button onclick="eliminarMedicamento(${med.id})" class="text-red-600 hover:underline text-xs">🗑️ Borrar</button>
                            </td>
                        </tr>
                    `;
          });
        } catch (error) {
          console.error(error);
        }
      }

      async function agregarMedicamento(event) {
        event.preventDefault();
        const tokenMFA = document.getElementById("globalMfaToken").value.trim();
        const bodyData = {
          nombre: document.getElementById("nombre").value,
          categoria: document.getElementById("categoria").value,
          precio: parseFloat(document.getElementById("precio").value),
          stock: parseInt(document.getElementById("stock").value),
        };

        try {
          const response = await fetch(`${API_URL}/medicamentos`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-mfa-token": tokenMFA,
            },
            body: JSON.stringify(bodyData),
          });

          // 🔍 LEER EL MENSAJE REAL DEL BACKEND
          if (!response.ok) {
            const errorData = await response.json();
            alert(
              `🚨 Error (${response.status}): ${errorData.error || "Operación denegada"}`,
            );
            return;
          }

          document.getElementById("formMedicamento").reset();
          listarMedicamentos();
        } catch (err) {
          alert("Error de conexión.");
        }
      }

      async function eliminarMedicamento(id) {
        const tokenMFA = document.getElementById("globalMfaToken").value.trim();
        if (!confirm("¿Eliminar registro?")) return;

        try {
          const response = await fetch(`${API_URL}/medicamentos/${id}`, {
            method: "DELETE",
            headers: { "x-mfa-token": tokenMFA },
          });

          // LEER EL MENSAJE REAL DEL BACKEND
          if (!response.ok) {
            const errorData = await response.json();
            alert(
              `🚨 Error (${response.status}): ${errorData.error || "Operación denegada"}`,
            );
            return;
          }

          listarMedicamentos();
        } catch (err) {
          alert("Error de conexión.");
        }
      }
    </script>
  </body>
</html>
